#cloud-config

apt_update: true
apt_upgrade: true

packages:
  - apt-transport-https 
  - ca-certificates 
  - curl

users:
  - name: appuser
    sudo: ALL=(ALL) NOPASSWD:ALL
    home: /home/appuser
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  ubuntu@jannik-recklies-project

runcmd:
  - curl -sfL https://get.k3s.io | K3S_URL=https://192.168.2.105:6443 K3S_TOKEN=K10329bd27d0255302da45bbb359f0031cf4eaa67345e1130ce099403209f74bbb4::server:ab2fc49bb8b797dc0fe90f93abb0c62a sh -
  #- curl -sfL https://get.k3s.io | K3S_URL=https://<IP>:6443 K3S_TOKEN=<k3s_token> sh -

byobu_default: system

final_message: "The system is finally up, after $UPTIME seconds"
