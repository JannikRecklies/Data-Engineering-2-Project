#cloud-config

apt_update: true
apt_upgrade: true

packages:
  - apt-transport-https 
  - ca-certificates 
  - curl

users:
  - name: appuser
    sudo: ALL=(ALL) NOPASSWD:ALL
    home: /home/appuser
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  ubuntu@jannik-recklies-project

runcmd:
  - curl -sfL https://get.k3s.io | K3S_URL=https://192.168.2.84:6443 K3S_TOKEN=K10905583fd8411eff875fc1070b957b6fbe24730bc4688bd830b067b5b4493e778::server:9f4ad6816ce3e64e14df2d4d4d459880 sh -
  #- curl -sfL https://get.k3s.io | K3S_URL=https://<IP>:6443 K3S_TOKEN=<k3s_token> sh -

byobu_default: system

final_message: "The system is finally up, after $UPTIME seconds"
