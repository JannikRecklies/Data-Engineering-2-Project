apiVersion: batch/v1
kind: Job
metadata:
  name: github-metadata-fetcher
spec:
  template:
    metadata:
      labels:
        app: github-metadata-fetcher
    spec:
      containers:
      - name: github-metadata-fetcher
        image: jannikrecklies/gh-metadata-fetcher:latest  # Replace with your Docker image name
        imagePullPolicy: Always
        env:
        - name: PULSAR_BROKER_URL
          value: "pulsar://pulsar-broker:6650"  # Set the Pulsar broker URL
        - name: GITHUB_BEARER_TOKEN
          value: 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
        - name: PULSAR_PUSH_TOPIC
          value: languages-processing-test
      restartPolicy: Never
  backoffLimit: 4  # Number of retries before considering the Job as failed
